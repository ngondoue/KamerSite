<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Place | Yaoundé Gems</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/place.css">

</head>

<body>

    <div id="site-header"></div>


    <main>

        <section class="section container">

            <!-- PLACE HEADER -->

            <div class="place-header">

                <div>

                    <a
                        href="explore.html"
                        class="back-link"
                    >
                        ← Back to Explore
                    </a>

                    <h1 id="place-name">
                        Loading...
                    </h1>

                    <p
                        id="place-location"
                        class="place-location"
                    ></p>

                </div>


                <button
                    id="favorite-button"
                    class="btn btn-secondary favorite-button"
                >
                    ♡ Save Place
                </button>

            </div>


            <!-- PLACE IMAGE -->

            <div
                id="place-gallery"
                class="place-gallery"
            >

                <img
                    id="main-place-image"
                    src=""
                    alt="Place image"
                >

            </div>

</body>

</html>

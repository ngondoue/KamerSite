<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Yaoundé Gems</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

    <div id="site-header"></div>


    <main>

        <!-- Profile page main container -->
        <section class="section container profile-page">

            <!-- User summary card -->
            <div class="profile-card">

                <div
                    class="profile-avatar"
                    id="profile-avatar"
                >
                    ?
                </div>

                <div class="profile-info">

                    <h1 id="profile-name">
                        Loading...
                    </h1>

                    <p
                        id="profile-email"
                        class="profile-email"
                    >
                        Loading...
                    </p>

                    <div class="profile-meta">

                        <span
                            class="tag"
                            id="profile-role-tag"
                        >
                            Member
                        </span>

                        <span
                            class="profile-joined"
                            id="profile-joined"
                        ></span>

                    </div>

                </div>

            </div>


            <!-- Main profile actions and saved content -->
            <div class="profile-grid">

                <!-- Edit profile form -->
                <div class="profile-panel">

                    <h2>Edit Profile</h2>

                    <p class="panel-description">
                        Update your account information.
                    </p>


                    <form
                        id="profile-form"
                        class="profile-form"
                    >

                        <div class="form-field">

                            <label for="profile-name-input">
                                Full name
                            </label>

                            <input
                                type="text"
                                id="profile-name-input"
                                required
                            >

                        </div>


                        <div class="form-field">

                            <label for="profile-image-input">
                                Profile image URL
                            </label>

                            <input
                                type="url"
                                id="profile-image-input"
                                placeholder="https://example.com/image.jpg"
                            >

                        </div>


                        <p
                            id="profile-form-error"
                            class="form-error"
                            hidden
                        ></p>


                        <p
                            id="profile-form-success"
                            class="form-success"
                            hidden
                        >
                            Profile updated successfully.
                        </p>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                    </form>

                </div>


                <!-- Favorite places section -->
                <div class="profile-panel">

                    <h2>My Favorites</h2>

                    <p class="panel-description">
                        Places you have saved while exploring.
                    </p>


                    <div
                        id="favorites-list"
                        class="favorites-list"
                    >
                        Loading favorites...
                    </div>

                </div>

            </div>


            <!-- Account management section -->
            <div class="profile-panel account-panel">

                <h2>Account</h2>

                <p class="panel-description">
                    Manage your Yaoundé Gems account.
                </p>

                <button
                    class="btn btn-secondary"
                    id="profile-logout-btn"
                >
                    Log Out
                </button>

            </div>

        </section>

    </main>


    <div id="site-footer"></div>


    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Yaoundé Gems</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">

</head>

<body>

    <div id="site-header"></div>


    <main>

        <section class="section container profile-page">

            <!-- PROFILE HEADER -->

            <div class="profile-card">

                <div
                    class="profile-avatar"
                    id="profile-avatar"
                >
                    ?
                </div>

                <div class="profile-info">

                    <h1 id="profile-name">
                        Loading...
                    </h1>

                    <p
                        id="profile-email"
                        class="profile-email"
                    >
                        Loading...
                    </p>

                    <div class="profile-meta">

                        <span
                            class="tag"
                            id="profile-role-tag"
                        >
                            Member
                        </span>

                        <span
                            class="profile-joined"
                            id="profile-joined"
                        ></span>

                    </div>

                </div>

            </div>
